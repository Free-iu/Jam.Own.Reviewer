<script>
const D=[
["12 Nervous Tissue",[
["Divisions","CNS = brain + spinal cord. PNS = nerves/ganglia; somatic (voluntary skeletal muscle), autonomic (smooth/cardiac muscle, glands), enteric. Functions: sensory, integrative, motor."],
["Neuroglia","CNS: astrocytes (blood–brain barrier, K⁺ buffer), oligodendrocytes (myelin), microglia (phagocytes), ependymal (CSF). PNS: Schwann cells (myelin, one axon each), satellite cells."],
["Resting membrane potential","About −70 mV, from unequal ion distribution, leak channels (more K⁺ leaks out than Na⁺ in), and the Na⁺/K⁺ ATPase pump (3 Na⁺ out, 2 K⁺ in)."],
["Graded vs action potential","Graded: variable amplitude, decremental, short range; ligand-/mechanically-gated channels. Action potential: all-or-none, regenerative; threshold ≈ −55 mV; depolarize (Na⁺ in) → repolarize (K⁺ out) → afterhyperpolarization."],
["Conduction speed","Faster with larger diameter and myelination. Continuous conduction = unmyelinated; saltatory conduction = jumps between nodes of Ranvier (myelinated)."],
["Synapses","Electrical (gap junctions) vs chemical (neurotransmitter, Ca²⁺-triggered exocytosis). EPSP depolarizes; IPSP hyperpolarizes. Summation: spatial (different sites) and temporal (same site, different times)."],
["Neurotransmitters","ACh, amino acids (glutamate = main excitatory; GABA, glycine = inhibitory), biogenic amines (NE, epi, dopamine, serotonin), neuropeptides, NO. Ionotropic = fast; metabotropic = slower, G-protein."],
["Circuits &amp; repair","Diverging, converging, reverberating, parallel after-discharge. Regeneration occurs in PNS (neurolemma guides regrowth); CNS is limited."]]],
["13 Spinal Cord &amp; Spinal Nerves",[
["Protection","Vertebral column, meninges (dura, arachnoid, pia mater), CSF. Epidural space lies outside the dura. Cord ends at L1–L2 (conus medullaris); cauda equina below."],
["Cord anatomy","Cervical and lumbar enlargements. Gray matter: horns (posterior = sensory, anterior = somatic motor, lateral = autonomic T1–L2). White matter: columns of tracts."],
["Spinal nerves","31 pairs (8 C, 12 T, 5 L, 5 S, 1 Co); all are mixed. Dorsal root = sensory (ganglion); ventral root = motor. Branches: rami, meningeal."],
["Plexuses","Cervical (C1–C5; phrenic nerve C3–C5 → diaphragm), brachial (C5–T1; axillary, musculocutaneous, radial, median, ulnar), lumbar (L1–L4; femoral, obturator), sacral (L4–S4; sciatic). Thoracic nerves T2–T12 are intercostal, no plexus."],
["Dermatomes","Skin area supplied by one spinal nerve; all spinal nerves except C1 have one."],
["Cord physiology","Sensory (ascending) tracts and motor (descending) tracts; reflex arc = receptor → sensory neuron → integrating center → motor neuron → effector. Types: stretch, tendon, flexor, crossed extensor (ipsilateral vs contralateral)."]]],
["14 Brain &amp; Cranial Nerves",[
["Organization","Major parts: brainstem (medulla, pons, midbrain), cerebellum, diencephalon (thalamus, hypothalamus), cerebrum. Protected by cranial meninges and CSF."],
["CSF","Made by choroid plexuses; flows lateral ventricles → 3rd → 4th → subarachnoid space; reabsorbed through arachnoid villi into the superior sagittal sinus. Blood–brain barrier protects."],
["Brainstem","Medulla: heart rate, breathing, vasomotor centers, pyramids decussate. Pons: relays, pontine respiratory centers. Midbrain: colliculi (visual/auditory reflexes), substantia nigra (dopamine). Reticular formation = arousal."],
["Cerebellum &amp; diencephalon","Cerebellum: coordination, balance, posture. Thalamus: relay station. Hypothalamus: homeostasis, autonomic control, endocrine control, body temperature, hunger/thirst, circadian rhythm."],
["Cerebrum","Gyri, sulci, fissures; lobes: frontal, parietal, temporal, occipital, insula. White matter: association, commissural (corpus callosum), projection tracts. Basal nuclei (movement), limbic system (emotion, memory; hippocampus)."],
["Cortical areas","Sensory: primary somatosensory (parietal), visual (occipital), auditory (temporal), gustatory, olfactory. Motor: primary motor (precentral gyrus). Broca's area = speech production; Wernicke's/common integrative = comprehension. EEG: alpha, beta, theta, delta waves."],
["Cranial nerves (12)","I Olfactory (S), II Optic (S), III Oculomotor, IV Trochlear, V Trigeminal (largest, mixed), VI Abducens, VII Facial, VIII Vestibulocochlear (S), IX Glossopharyngeal, X Vagus, XI Accessory, XII Hypoglossal. Mnemonic: Oh Oh Oh To Touch And Feel Very Green Vegetables AH!"],
["Development &amp; aging","Neural tube → three primary vesicles (prosencephalon, mesencephalon, rhombencephalon) → five secondary vesicles. Aging: reduced brain mass and slower processing."]]],
["15 Autonomic Nervous System",[
["Somatic vs ANS","Somatic: one motor neuron, always excitatory, ACh to skeletal muscle. ANS: two-neuron chain (preganglionic → ganglion → postganglionic), excitatory or inhibitory, to smooth muscle, cardiac muscle, glands."],
["Sympathetic","Thoracolumbar outflow (T1–L2); short preganglionic, long postganglionic; sympathetic trunk ganglia, prevertebral ganglia (celiac, superior/inferior mesenteric); adrenal medulla. 'Fight or flight' with wide, diffuse effects."],
["Parasympathetic","Craniosacral outflow (CN III, VII, IX, X and S2–S4); long preganglionic, short postganglionic; terminal ganglia. 'Rest and digest', localized effects."],
["Neurotransmitters","Cholinergic: ACh (all preganglionic; parasympathetic postganglionic) with nicotinic and muscarinic receptors. Adrenergic: NE (most sympathetic postganglionic) with α and β receptors."],
["Physiology &amp; control","Dual innervation with opposing effects, autonomic tone. Hypothalamus is the main control center; autonomic reflexes (e.g., baroreceptor), with input from limbic system and cortex."]]],
["16 Sensory, Motor &amp; Integrative",[
["Sensation","Receptor types: mechanoreceptors, thermoreceptors, nociceptors, photoreceptors, chemoreceptors. Adaptation: rapid (touch) vs slow (pain, proprioceptors)."],
["Somatic senses","Tactile (Meissner, Merkel, Pacinian, Ruffini), thermal, pain (fast A-delta, slow C fibers). Referred pain: visceral pain felt on the body surface. Proprioception: muscle spindles, tendon organs, joint receptors."],
["Sensory pathways","3-neuron chain to cortex. Posterior column–medial lemniscus: fine touch, vibration, proprioception (crosses in medulla). Anterolateral (spinothalamic): pain, temperature (crosses in cord). Spinocerebellar: unconscious proprioception."],
["Motor pathways","Direct (pyramidal): corticospinal (lateral and anterior) and corticobulbar. Indirect (extrapyramidal): rubrospinal, tectospinal, vestibulospinal, reticulospinal. Upper vs lower motor neurons. Basal nuclei and cerebellum modulate movement."],
["Integrative functions","Wakefulness and sleep (RAS; NREM and REM), learning and memory (short/long term), language, emotion."]]],
["17 The Special Senses",[
["Olfaction","Olfactory epithelium in the superior nasal cavity; bipolar receptor cells → olfactory bulb → CN I → olfactory cortex. Fast adaptation. Directly linked to the limbic system."],
["Gustation","Taste buds in papillae (circumvallate, fungiform, foliate). Five tastes: sweet, sour, salty, bitter, umami. CN VII, IX, X carry taste."],
["Eye anatomy","Tunics: fibrous (sclera, cornea), vascular (choroid, ciliary body, iris), nervous (retina). Lens; aqueous humor (anterior cavity), vitreous body (posterior cavity). Accessory: eyelids, lacrimal apparatus, extrinsic muscles."],
["Vision physiology","Refraction, accommodation (lens thickens, pupil constricts, convergence). Rods: dim light, low acuity. Cones: color, acuity (fovea). Rhodopsin/photopigment cycle. Pathway: retina → optic nerve → chiasm → LGN → occipital cortex."],
["Ear &amp; hearing","Outer (auricle, canal, tympanic membrane), middle (ossicles: malleus, incus, stapes; auditory tube), inner (cochlea, vestibule, semicircular canals). Sound → ossicles → oval window → perilymph waves → hair cells of organ of Corti."],
["Equilibrium","Static: utricle and saccule (maculae, otoliths). Dynamic: semicircular canals (cristae in ampullae). Via CN VIII to brainstem and cerebellum."]]],
["18 The Endocrine System",[
["Endocrine vs nervous","Endocrine: hormones via blood, slower and longer lasting. Nervous: nerve impulses, fast and brief. Hormones act on target cells with specific receptors."],
["Hormone action","Lipid-soluble (steroids, thyroid hormones): intracellular receptors → gene activation. Water-soluble: membrane receptors → G-proteins → second messenger (cAMP). Control by negative (most) or positive feedback."],
["Hypothalamus &amp; pituitary","Anterior: GH, TSH, ACTH, FSH, LH, PRL (regulated by releasing/inhibiting hormones via portal system). Posterior: oxytocin and ADH (made in the hypothalamus, stored in the posterior pituitary)."],
["Thyroid &amp; parathyroid","Thyroid: T3/T4 (metabolic rate; need iodine), calcitonin (lowers blood Ca²⁺). Parathyroid: PTH raises blood Ca²⁺ (bone, kidney, calcitriol activation)."],
["Adrenal glands","Cortex: mineralocorticoids (aldosterone; Na⁺/K⁺), glucocorticoids (cortisol; stress, anti-inflammatory), androgens. Medulla: epinephrine and NE."],
["Pancreas &amp; others","Alpha cells: glucagon (raises glucose). Beta cells: insulin (lowers glucose). Delta: somatostatin. Pineal: melatonin. Thymus: thymosin. Gonads: sex hormones. Others: eicosanoids, kidneys, heart, GI hormones."],
["Stress response","Alarm (sympathetic and adrenal medulla), resistance (cortisol, GH), exhaustion."]]],
["19 CV System: The Blood",[
["Blood basics","Plasma (≈55%, mostly water) and formed elements (≈45%). Functions: transport, regulation (pH, temperature, osmosis), protection. Hematocrit: ≈ 42–45%."],
["Hemopoiesis","Red bone marrow stem cells → myeloid (RBCs, platelets, granulocytes, monocytes) and lymphoid (lymphocytes). Hormones: EPO (RBCs), TPO (platelets), CSFs and interleukins (WBCs)."],
["Red blood cells","Biconcave, no nucleus, hemoglobin (4 globin + 4 heme, carries O₂ on Fe²⁺). Lifespan ≈120 days; broken down in spleen/liver, recycling of iron and bilirubin."],
["White blood cells","Granular: neutrophils (phagocytes), eosinophils (parasites, allergy), basophils (histamine, heparin). Agranular: lymphocytes (B, T, NK), monocytes (→ macrophages). Mnemonic: Never Let Monkeys Eat Bananas."],
["Platelets &amp; hemostasis","Vascular spasm → platelet plug → coagulation (intrinsic + extrinsic → common pathway: prothrombinase → thrombin → fibrin). Fibrinolysis by plasmin. Anticoagulants: heparin, warfarin."],
["Blood groups","ABO (antigens A, B; O = universal donor, AB = universal recipient) and Rh. Hemolytic disease of the newborn: Rh⁻ mother with Rh⁺ fetus."]]],
["20 CV System: The Heart",[
["Heart anatomy","In mediastinum; pericardium (fibrous, serous: parietal and visceral/epicardium). Wall: epicardium, myocardium, endocardium. Four chambers: right and left atria and ventricles."],
["Valves &amp; circulation","AV valves: tricuspid (right), bicuspid/mitral (left); semilunar: pulmonary and aortic. Pulmonary circuit: RV → lungs → LA. Systemic: LV → body → RA. Coronary circulation supplies the heart (blocked → MI)."],
["Conduction system","SA node (pacemaker, ≈100 bpm intrinsic) → AV node → AV bundle (of His) → bundle branches → Purkinje fibers. Intercalated discs with gap junctions and desmosomes. Long refractory period prevents tetanus."],
["ECG &amp; cardiac cycle","P wave = atrial depolarization; QRS = ventricular depolarization; T wave = ventricular repolarization. Cycle: relaxation, ventricular filling, ventricular systole (isovolumetric contraction → ejection), isovolumetric relaxation. Heart sounds: S1 (AV close), S2 (SL close)."],
["Cardiac output","CO = SV × HR (≈5.25 L/min). SV regulated by preload (Frank–Starling law), contractility, and afterload. HR regulated by ANS (sympathetic ↑, parasympathetic/vagus ↓), hormones, ions, age, temperature."],
["Clinical","Exercise ↑ cardiac reserve. Failing hearts: transplants, VADs, pacemakers. Development: heart tubes form in the 3rd week."]]],
["21 Blood Vessels &amp; Hemodynamics",[
["Vessel structure","Arteries (elastic and muscular; thick tunica media), arterioles (resistance), capillaries (continuous, fenestrated, sinusoids; exchange), venules and veins (valves, capacitance vessels; ≈64% of blood volume)."],
["Capillary exchange","Diffusion (main), vesicular transport, bulk flow. Net filtration pressure = (BHP + IFOP) − (BCOP + IFHP). Filtration at arterial end; reabsorption at venous end; excess fluid returns via lymph. Edema = imbalance."],
["Blood pressure","BP = CO × resistance. Resistance depends on vessel radius (most important), length, and blood viscosity. Mean arterial pressure ≈ diastolic + ⅓ pulse pressure."],
["Regulation of BP","Neural: cardiovascular center in the medulla; baroreceptors (carotid sinus, aortic arch), chemoreceptors. Hormonal: renin–angiotensin–aldosterone, ADH, epinephrine/NE, ANP (↓ BP). Autoregulation by local vasodilators."],
["Checking circulation &amp; shock","Pulse, BP via sphygmomanometer (Korotkoff sounds). Shock: hypovolemic, cardiogenic, vascular, obstructive; stages and compensation."],
["Pathways &amp; development","Aorta: ascending, arch (brachiocephalic, L common carotid, L subclavian), thoracic, abdominal (celiac, SMA, renal, IMA, common iliacs). Veins: superior and inferior vena cava; hepatic portal circulation; fetal circulation (ductus venosus, foramen ovale, ductus arteriosus). Aging: ↑ BP and atherosclerosis."]]]
];

const hl=s=>s.replace(/(^|[.;] )([A-Z][A-Za-z0-9⁺⁻₂\/' –()-]{1,30}):/g,'$1<strong>$2:</strong>').replace(KW,'<mark>$&</mark>');
const rv=`<button onclick="this.nextElementSibling.hidden=false">Reveal</button>`;
function start(){S=sh(pool());if(sub=='test')S=S.slice(0,10);if(sub=='match')S=S.slice(0,6);tot=S.length;k=0;fl=false;sc=0;sel=null;S.forEach(c=>{c.w=0;c.o=sh([c[1],...sh(AL.filter(a=>a!=c[1])).slice(0,3)])});T=sh(S.flatMap((c,i)=>[[c[0],i],[c[1],i]]));m=[];pk=null;tm=Date.now();draw()}
function pick(i){if(sel!=null)return;const c=S[k];sel=c.o[i];if(sel==c[1]){if(!c.w)sc++}else{c.w=1;if(sub=='learn')S.push(c)}draw()}
function tp(i){if(m.includes(i))return;if(pk==null)pk=i;else{if(pk!=i&&T[pk][1]==T[i][1])m.push(pk,i);pk=null}draw()}
function study(){
 let h='<div class="tools">'+[['flash','Flashcards'],['learn','Learn'],['test','Test'],['match','Match']].map(([a,l])=>`<button class="${a==sub?'on':''}" onclick="sub='${a}';start()">${l}</button>`).join('')+`<select onchange="deck=this.value;start()">`+[['mix','All cards'],['c','Concept cards'],['x','Antagonist cards']].map(([a,l])=>`<option value="${a}" ${a==deck?'selected':''}>${l}</option>`).join('')+'</select></div>';
 if(sub=='flash'){const c=S[k];h+=`<div class="fc" onclick="fl=!fl;draw()">${fl?c[1]:(c[2]?'Spot the difference: ':'')+c[0]}</div><div class="tools"><button onclick="k=(k+S.length-1)%S.length;fl=false;draw()">←</button><span>${k+1} / ${S.length} · tap card to flip</span><button onclick="k=(k+1)%S.length;fl=false;draw()">→</button><button onclick="start()">Shuffle</button></div>`}
 else if(sub=='match'){const d=m.length==T.length;h+=d?`<div class="item"><b>Cleared</b>All pairs matched in ${((Date.now()-tm)/1000).toFixed(1)}s. <button onclick="start()">Play again</button></div>`:'<p style="font:14px system-ui;color:var(--mu)">Match each question with its answer.</p>';h+='<div class="grid">'+T.map((t,i)=>m.includes(i)?'':`<button class="tile ${pk==i?'on':''}" onclick="tp(${i})">${t[0]}</button>`).join('')+'</div>'}
 else if(k>=S.length){h+=`<div class="item"><b>${sub=='test'?'Test':'Learn'} complete</b>First-try score: ${sc} / ${tot} <button onclick="start()">Retry</button></div>`}
 else{const c=S[k];h+=`<div class="item"><b>${sub} · ${Math.min(k+1,S.length)} / ${S.length}</b>${c[2]?'<strong>[Antagonist]</strong> ':''}${c[0]}</div>`+c.o.map((o,i)=>`<button class="opt ${sel==null?'':o==c[1]?'ok':o==sel?'no':''}" onclick="pick(${i})">${o}</button>`).join('')+(sel!=null?`<button class="on" onclick="k++;sel=null;draw()">Next →</button>`:'')}
 return h}
function draw(){
 $('#modes').innerHTML=M.map(([a,l])=>`<button class="${a==mode?'on':''}" onclick="mode='${a}';draw()">${l}</button>`).join('');
 if(mode=='study'&&!S.length){start();return}
 let h='';
 if(mode=='study')h=study();
 else idx().forEach(i=>{h+=`<h2>Chapter ${D[i][0]}</h2>`;
  if(mode=='notes')h+=D[i][1].map(([a,b])=>`<div class="item"><b>${a}</b>${hl(b)}</div>`).join('');
  if(mode=='devil')h+=E[i].d.map(([b,r])=>`<div class="two"><div><b>Common belief</b>${b}</div><div class="dv"><b>Devil’s advocate</b>${hl(r)}</div></div>`).join('');
  if(mode=='ask')h+=E[i].c.map(([q,a])=>`<div class="item"><b>Interrogate: why / how?</b>${q}<textarea placeholder="Answer in your own words first…"></textarea>${rv}<p hidden>${hl(a)}</p></div>`).join('');
  if(mode=='role')h+=E[i].d.map(([b,r])=>`<div class="item"><b>Dr. Skeptic insists</b>“${b}”<textarea placeholder="Your rebuttal, as the professor…"></textarea>${rv}<p hidden>${hl(r)}</p></div>`).join('')});
 $('#out').innerHTML=h}
draw();
</script></body></html>
